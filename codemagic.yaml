workflows:
  ios-simulator-validation:
    name: iOS Simulator Validation
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "StarforgeIdle.xcodeproj"
        XCODE_SCHEME: "StarforgeIdle"
        BUNDLE_ID: "com.manuelferreira.starforgeidle"
    scripts:
      - name: Show tool versions
        script: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Run core gameplay tests
        script: |
          set -euo pipefail
          swift test

      - name: Build unsigned simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        script: |
          set -euo pipefail
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r StarforgeIdle-simulator.zip StarforgeIdle.app

      - name: Launch app and capture simulator screenshot
        script: |
          set -uo pipefail
          mkdir -p build/screenshots build/simulator-diagnostics

          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/StarforgeIdle.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Simulator app was not found at $APP_PATH"
            exit 1
          fi

          DETECTED_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -n "$DETECTED_BUNDLE_ID" ]; then
            BUNDLE_ID="$DETECTED_BUNDLE_ID"
          fi
          echo "Using bundle id: $BUNDLE_ID"

          xcrun simctl list devices available --json > build/simulator-diagnostics/devices.json || true
          xcrun simctl list runtimes > build/simulator-diagnostics/runtimes.txt || true

          SIM_UDID=$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path("build/simulator-diagnostics/devices.json").read_text())
          preferred_names = ["iPhone 16", "iPhone 15", "iPhone 14", "iPhone 13", "iPhone 12", "iPhone 11"]
          candidates = []

          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue

              version_bits = [int(part) for part in re.findall(r"\d+", runtime)]
              runtime_score = tuple(version_bits) if version_bits else (0,)

              for device in devices:
                  name = device.get("name", "")
                  if not device.get("isAvailable") or not name.startswith("iPhone"):
                      continue

                  try:
                      name_score = len(preferred_names) - preferred_names.index(name)
                  except ValueError:
                      name_score = 0

                  candidates.append((runtime_score, name_score, device.get("state") == "Shutdown", device["udid"], name, runtime))

          if not candidates:
              raise SystemExit("No available iPhone simulator found")

          candidates.sort(reverse=True)
          selected = candidates[0]
          Path("build/simulator-diagnostics/selected-device.txt").write_text(
              f"name={selected[4]}\nruntime={selected[5]}\nudid={selected[3]}\n"
          )
          print(selected[3])
          PY
          )

          echo "Selected simulator:"
          cat build/simulator-diagnostics/selected-device.txt

          trap 'xcrun simctl shutdown "$SIM_UDID" >/dev/null 2>&1 || true' EXIT

          xcrun simctl shutdown all >/dev/null 2>&1 || true
          xcrun simctl boot "$SIM_UDID" > build/simulator-diagnostics/boot.txt 2>&1 || true
          xcrun simctl bootstatus "$SIM_UDID" -b > build/simulator-diagnostics/bootstatus.txt 2>&1
          BOOT_STATUS=$?
          if [ "$BOOT_STATUS" -ne 0 ]; then
            echo "Simulator boot did not complete on this runner. Build and package steps already passed."
            cat build/simulator-diagnostics/bootstatus.txt || true
            exit 0
          fi

          open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID" >/dev/null 2>&1 || true
          xcrun simctl install "$SIM_UDID" "$APP_PATH" > build/simulator-diagnostics/install.txt 2>&1
          INSTALL_STATUS=$?
          if [ "$INSTALL_STATUS" -ne 0 ]; then
            echo "Simulator install failed. Build and package steps already passed."
            cat build/simulator-diagnostics/install.txt || true
            exit 0
          fi

          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" > build/simulator-diagnostics/launch.txt 2>&1
          LAUNCH_STATUS=$?
          cat build/simulator-diagnostics/launch.txt || true
          if [ "$LAUNCH_STATUS" -ne 0 ]; then
            echo "Simulator launch failed. Build and package steps already passed."
            xcrun simctl spawn "$SIM_UDID" log show --style compact --last 5m > build/simulator-diagnostics/simulator-log.txt 2>&1 || true
            exit 0
          fi

          sleep 8
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/starforge-idle-forge.png > build/simulator-diagnostics/screenshot.txt 2>&1 || true
          if [ -f build/screenshots/starforge-idle-forge.png ]; then
            echo "Captured simulator screenshot."
          else
            echo "Screenshot capture was not available on this runner. Build, tests, packaging, install, and launch completed."
            cat build/simulator-diagnostics/screenshot.txt || true
          fi

    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/StarforgeIdle-simulator.zip
      - build/screenshots/*.png
      - build/simulator-diagnostics/*
      - build/DerivedData/Logs/**/*.xcresult
